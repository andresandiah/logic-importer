<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Logic Importer for LUNA</title>
  <desc id="d">From a Logic Pro project to a new LUNA session. Unofficial beta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181c"/>
      <stop offset="1" stop-color="#25221a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="62" width="196" height="34" rx="17" fill="none" stroke="#F7C449" stroke-width="1.5"/>
    <text x="170" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#F7C449" letter-spacing="1.2">UNOFFICIAL · BETA</text>
    <text x="68" y="182" font-size="62" font-weight="800" fill="#ffffff">Logic Importer</text>
    <text x="72" y="232" font-size="30" font-weight="500" fill="#F7C449">for LUNA</text>
    <text x="72" y="294" font-size="21" fill="#c9c9ce">From a Logic Pro project</text>
    <text x="72" y="324" font-size="21" fill="#c9c9ce">to a new LUNA session.</text>
  </g>

  <!-- Source tracks -->
  <g>
    <rect x="610" y="78" width="214" height="244" rx="14" fill="#101114" stroke="#3a3b42"/>
    <rect x="630" y="104" width="130" height="22" rx="5" fill="#6f8fbf"/>
    <rect x="652" y="140" width="150" height="22" rx="5" fill="#7fae8a"/>
    <rect x="652" y="176" width="104" height="22" rx="5" fill="#7fae8a"/>
    <rect x="630" y="212" width="164" height="22" rx="5" fill="#b0809e"/>
    <rect x="652" y="248" width="124" height="22" rx="5" fill="#b0809e"/>
    <rect x="630" y="284" width="92" height="16" rx="5" fill="#55565e"/>
  </g>

  <!-- Arrow -->
  <g stroke="#F7C449" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M862 200 H940"/>
    <path d="M914 172 L944 200 L914 228"/>
  </g>

  <!-- Destination mixer -->
  <g>
    <rect x="982" y="78" width="226" height="244" rx="14" fill="#101114" stroke="#F7C449" stroke-opacity="0.7"/>
    <g stroke="#45464e" stroke-width="5" stroke-linecap="round">
      <path d="M1022 108 V290"/>
      <path d="M1070 108 V290"/>
      <path d="M1118 108 V290"/>
      <path d="M1166 108 V290"/>
    </g>
    <g fill="#F7C449">
      <rect x="1006" y="176" width="32" height="18" rx="4"/>
      <rect x="1054" y="140" width="32" height="18" rx="4"/>
      <rect x="1102" y="214" width="32" height="18" rx="4"/>
      <rect x="1150" y="160" width="32" height="18" rx="4"/>
    </g>
  </g>
</svg>
